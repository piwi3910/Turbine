# turbine-server configuration for the Phase 7 one-card gate of gpt-oss-20b (MXFP4 experts, ~14 GB) on novanas:
#   scripts/lab-bench.sh --model gpt-oss-20b [--golden16]
#   scripts/lab-perf.sh novanas gpt-oss-20b
#   scripts/lab-serve.sh novanas scripts/lab/phase7-novanas-gpt-oss-20b.yaml [--set <k>=<v>]...
# Weights: /home/piwi/turbine-models/gpt-oss-20b on the host, mounted read-only at /models by
# scripts/lab/novanas-serve-job.yaml (lab-bench.sh serves natively and overrides model.path).
# The served id is the checkpoint's repo id, as `lab-serve.sh --vllm gpt-oss-20b` serves vLLM-ROCm.
# Execution, scheduler and KV keys as scripts/lab/phase2c-novanas-llama.yaml.
server:
  listen: 0.0.0.0:18000
model:
  path: /models/gpt-oss-20b
  served_name: openai/gpt-oss-20b
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: true
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    # The Phase 2 scheduler.queue_timeout (CONFLICT C-1).
    queue_timeout: 60s
