# turbine-server configuration for the Phase 6a `fp8` proof (spec S-11, the gate checkpoint):
#   RedHatAI/Llama-3.2-3B-Instruct-FP8-dynamic @ c308a86de78778c5f904a1d82401ac85e18ca205 —
#   compressed-tensors FP8, per-channel weight scales, dynamic per-token activations (W8A8 on
#   hipblaslt_fp8).
#   scripts/lab-bench.sh --model llama-fp8 [--golden16] [--quick]
# lab-bench.sh overrides model.path with /home/piwi/turbine-models/llama-3.2-3b-instruct-fp8-dynamic.
# A copy of scripts/lab/phase2c-novanas-llama.yaml (the same execution, KV and scheduler values),
# so its BENCH line compares with the BF16 Llama baseline.
server:
  listen: 0.0.0.0:18000
model:
  path: /models/llama-3.2-3b-instruct-fp8-dynamic
  served_name: RedHatAI/Llama-3.2-3B-Instruct-FP8-dynamic
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: false
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    queue_timeout: 60s
