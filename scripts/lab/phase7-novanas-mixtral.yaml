# turbine-server configuration for the Phase 7 two-card gate of Mixtral-8x7B-Instruct-v0.1-FP8 (~48 GB: ~24 GB per card; KV pool and
#   scheduler.max_running_requests sized 2026-10-14 (T22): the gate measured 4 GiB per-rank
#   headroom (/turbine/v1/kv ranks), the worst-case reservation at the gate shape (512+256 tokens
#   per request) is ~1.5 GiB/rank, so 32 running requests fit with margin; zero device_oom),
# tensor parallel over both R9700s (tensor_parallel_size 2) — the faster passing placement
#   (ep2's golden c16 gate is open, see perf-log "P7 Mixtral gate") — on novanas:
#   scripts/lab-cluster.sh [--bench-lock] mixtral-tp2-novanas   (golden, GSM8K, bench; pod loopback)
#   scripts/lab-perf.sh novanas mixtral --placement tp2 [--eval]  (vs vLLM-ROCm; listen overridden)
# Weights: /home/piwi/turbine-models/mixtral-8x7b-instruct-v0.1-fp8 on the host, mounted read-only at /models by the
# cluster and serve Jobs. The served id is the checkpoint's repo id, as `lab-serve.sh --vllm`
# serves vLLM-ROCm. Execution, scheduler and KV keys as scripts/lab/phase5-novanas-*.yaml.
server:
  listen: 127.0.0.1:18000
model:
  path: /models/mixtral-8x7b-instruct-v0.1-fp8
  served_name: RedHatAI/Mixtral-8x7B-Instruct-v0.1-FP8
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: true
parallel:
  tensor_parallel_size: 2
  data_parallel_size: 1
  devices: [0, 1]
  # auto: hostmem (RCCL above its thresholds) in local mode, rccl in static mode.
  collective_backend: auto
kv:
  block_tokens: 128
  gpu:
    max_bytes: 4GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 32
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    # The Phase 2 scheduler.queue_timeout (CONFLICT C-1).
    queue_timeout: 60s
