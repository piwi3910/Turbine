# turbine-server configuration for the Phase 2c performance runs on novanas:
#   scripts/lab-perf.sh novanas llama
#   scripts/lab-serve.sh novanas scripts/lab/phase2c-novanas-llama.yaml [--set <k>=<v>]...
# Weights: /home/piwi/turbine-models/llama-3.2-3b-instruct on the host, mounted read-only at
# /models by scripts/lab/novanas-serve-job.yaml. The Phase 2 lab values plus the five Phase 2c
# execution switches spelled out, so every lab-perf summary records what it ran with. The
# scheduler pair is tuned by the Phase 2c sweep (spec S-12).
server:
  listen: 0.0.0.0:18000
model:
  path: /models/llama-3.2-3b-instruct
  served_name: meta-llama/Llama-3.2-3B-Instruct
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
kv:
  block_tokens: 16
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 8192
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
  queue_timeout: 60s
