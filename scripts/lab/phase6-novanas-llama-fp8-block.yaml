# turbine-server configuration for the Phase 6a `fp8_block` proof (spec S-11):
#   unsloth/Llama-3.2-3B-Instruct-FP8-Block @ 08cf804398b23fab4a1df02fbe8d4d5a11a800cc —
#   128 x 128 block-scaled FP8 weights.
#   scripts/lab-bench.sh --model llama-fp8-block [--golden16] [--quick]
# lab-bench.sh overrides model.path with /home/piwi/turbine-models/llama-3.2-3b-instruct-fp8-block.
# A copy of scripts/lab/phase2c-novanas-llama.yaml (the same execution, KV and scheduler values),
# so its BENCH line compares with the BF16 Llama baseline.
server:
  listen: 0.0.0.0:18000
model:
  path: /models/llama-3.2-3b-instruct-fp8-block
  served_name: unsloth/Llama-3.2-3B-Instruct-FP8-Block
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: false
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    queue_timeout: 60s
