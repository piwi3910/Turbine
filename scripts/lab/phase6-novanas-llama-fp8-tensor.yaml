# turbine-server configuration for the Phase 6a `fp8` per-tensor proof (spec S-11):
#   RedHatAI/Llama-3.2-3B-Instruct-FP8 @ 377571d314b30f1d58448499e4100e2deafe7d7d —
#   compressed-tensors FP8, per-tensor weight scales, static per-tensor activation scales (W8A8
#   on hipblaslt_fp8).
#   scripts/lab-bench.sh --model llama-fp8-tensor [--golden16] [--quick]
# lab-bench.sh overrides model.path with /home/piwi/turbine-models/llama-3.2-3b-instruct-fp8.
# A copy of scripts/lab/phase2c-novanas-llama.yaml (the same execution, KV and scheduler values),
# so its BENCH line compares with the BF16 Llama baseline.
server:
  listen: 0.0.0.0:18000
model:
  path: /models/llama-3.2-3b-instruct-fp8
  served_name: RedHatAI/Llama-3.2-3B-Instruct-FP8
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: false
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    queue_timeout: 60s
