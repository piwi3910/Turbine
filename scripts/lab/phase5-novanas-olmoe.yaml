# turbine-server configuration for the Phase 5 tensor-parallel lab run on novanas:
#   scripts/lab-cluster.sh tp2-novanas
# Both R9700s of the Job form one TP group (tensor_parallel_size 2, local rank mode by default;
# the scenario runs OLMoE in local mode after the Llama runs). The server listens on
# the pod's loopback only. Weights: /home/piwi/turbine-models/olmoe-1b-7b-0125-instruct on the host,
# mounted read-only at /models by scripts/lab/novanas-cluster-job.yaml. Execution, scheduler and
# KV keys as scripts/lab/phase2c-novanas-olmoe.yaml, so the TP run is comparable with the
# single-GPU lab-bench baseline.
server:
  listen: 127.0.0.1:18000
model:
  path: /models/olmoe-1b-7b-0125-instruct
  served_name: allenai/OLMoE-1B-7B-0125-Instruct
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: false
parallel:
  tensor_parallel_size: 2
  data_parallel_size: 1
  devices: [0, 1]
  # auto: hostmem (RCCL above its thresholds) in local mode, rccl in static mode.
  collective_backend: auto
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    # The Phase 2 scheduler.queue_timeout (CONFLICT C-1).
    queue_timeout: 60s
