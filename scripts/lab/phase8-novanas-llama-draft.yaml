# turbine-server configuration for the Phase 8 draft-model proof on novanas (plan Task 14):
#   scripts/lab-serve.sh novanas scripts/lab/phase8-novanas-llama.yaml [--set <k>=<v>]...
# The Phase 2c Llama keys (BF16 weights and pages, the Phase 5p overlap default) plus the
# Phase 8 draft: Llama-3.2-1B-Instruct proposes four greedy tokens, the 3B target verifies them
# in one forward, and a request whose acceptance falls below 0.4 stops speculating. The draft
# checkpoint is fetched once into /home/piwi/turbine-models/llama-3.2-1b-instruct (mounted at
# /models by scripts/lab/novanas-serve-job.yaml).
server:
  listen: 0.0.0.0:18000
model:
  path: /models/llama-3.2-3b-instruct
  served_name: meta-llama/Llama-3.2-3B-Instruct
speculative:
  method: draft
  num_tokens: 4
  draft_model_path: /models/llama-3.2-1b-instruct
  min_acceptance: 0.4
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: true
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    queue_timeout: 60s
