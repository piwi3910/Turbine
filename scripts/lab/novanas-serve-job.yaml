# k3s Job run by scripts/lab-serve.sh novanas <config.yaml>: turbine-server on one R9700 for
# manual golden and benchmark runs, listening on the host network (server.listen of the config,
# 0.0.0.0:18000 in scripts/lab/phase1-novanas.yaml). The script copies the config to
# /home/piwi/turbine-ci/serve/config.yaml before applying this Job. Setup and mounts match
# novanas-test-job.yaml: cmake + python3 from Debian, libturbine_hip.so built from kernels/rocm,
# then the release turbine-server. Each step prints `lab-step: <name>`; a failing step prints
# `lab-step failed: <name>`. The Job runs until `scripts/lab-serve.sh novanas --stop`.
apiVersion: batch/v1
kind: Job
metadata:
  name: turbine-lab-serve
  namespace: turbine-ci
  labels:
    turbine-lab: "true"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        turbine-lab: "true"
    spec:
      restartPolicy: Never
      hostNetwork: true
      containers:
        - name: serve
          image: rust:1.97-trixie
          workingDir: /home/piwi/turbine-ci/src
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              STEP=setup
              step() { STEP="$1"; echo "lab-step: $1"; }
              trap 'echo "lab-step failed: ${STEP}" >&2' ERR
              export DEBIAN_FRONTEND=noninteractive

              step "install cmake python3"
              apt-get update -qq >/dev/null
              apt-get install -y -qq cmake python3 >/dev/null
              cmake --version | head -n 1

              step "build kernels/rocm"
              cmake -S kernels/rocm -B "$KERNEL_BUILD_DIR" \
                -DCMAKE_HIP_COMPILER="$TURBINE_ROCM_PATH/bin/hipcc" -DGPU_TARGETS=gfx1201
              cmake --build "$KERNEL_BUILD_DIR" --parallel "$(nproc)"
              test -f "$TURBINE_KERNEL_LIBRARY"
              echo "lab-step: built $TURBINE_KERNEL_LIBRARY"

              step "build turbine-server"
              cargo build --release -p turbine-server

              step "turbine-server"
              exec "$CARGO_TARGET_DIR/release/turbine-server" --config /home/piwi/turbine-ci/serve/config.yaml
          env:
            - name: CARGO_TARGET_DIR
              value: /home/piwi/turbine-ci/target
            - name: LD_LIBRARY_PATH
              value: /opt/rocm/rocm/lib:/opt/rocm/rocm/lib/rocm_sysdeps/lib
            - name: TURBINE_AMD_SMI_LIBRARY
              value: /opt/rocm/rocm/lib/libamd_smi.so.26.5.0
            # Every top-level entry of /opt/rocm/rocm on novanas is an /etc/alternatives
            # symlink; inside the container the real versioned tree is the ROCm root.
            - name: TURBINE_ROCM_PATH
              value: /opt/rocm/rocm/core-7.14
            - name: KERNEL_BUILD_DIR
              value: /home/piwi/turbine-ci/target/kernels
            - name: TURBINE_KERNEL_LIBRARY
              value: /home/piwi/turbine-ci/target/kernels/libturbine_hip.so
          resources:
            limits:
              amd.com/gpu: 1
          volumeMounts:
            - name: turbine-ci
              mountPath: /home/piwi/turbine-ci
            - name: cargo-registry
              mountPath: /usr/local/cargo/registry
            - name: rocm
              mountPath: /opt/rocm/rocm
              readOnly: true
            # /opt/rocm/rocm/lib is a symlink to /etc/alternatives/rocm-lib on novanas.
            - name: rocm-lib-alternative
              mountPath: /etc/alternatives/rocm-lib
              readOnly: true
            # Weights provisioned once over SSH; the server never downloads.
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: turbine-ci
          hostPath:
            path: /home/piwi/turbine-ci
            type: Directory
        - name: cargo-registry
          hostPath:
            path: /home/piwi/turbine-ci/cargo-registry
            type: DirectoryOrCreate
        - name: rocm
          hostPath:
            path: /opt/rocm/rocm
            type: Directory
        - name: rocm-lib-alternative
          hostPath:
            path: /etc/alternatives/rocm-lib
            type: Directory
        - name: models
          hostPath:
            path: /home/piwi/turbine-models
            type: Directory
