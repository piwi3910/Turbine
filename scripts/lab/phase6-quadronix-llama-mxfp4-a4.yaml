# turbine-server configuration for the Phase 7 `mxfp4_a4` proof on quadronix (plan Task 28):
#   scripts/lab-bench.sh --model llama-mxfp4-a4 [--golden16] [-- --set model.path=<dir>]
# Weights: matmelis/Llama_3.2_3B_w_mxfp4_a_mxfp4_gptq (AMD Quark W4A4: fp4 weights and dynamic fp4
# input activations per 32, E8M0 scales, GPTQ with static groups) in
# /home/piwi/turbine-models/llama-3.2-3b-mxfp4-a4 (lab-bench passes model.path). Turbine runs the
# weights on turbine_hip_mxfp4 after quantize-dequantizing each activation group to MXFP4 (support
# row amd/gfx1201/LlamaForCausalLM/mxfp4_a4/bf16/none). Golden
# tests/golden/llama-3.2-3b-instruct-mxfp4-a4/ (a transformers self-spread tolerance). The same
# values as the BF16 baseline scripts/lab/phase6-quadronix-llama.yaml.
server:
  listen: 0.0.0.0:18000
model:
  path: /models/llama-3.2-3b-mxfp4-a4
  served_name: matmelis/Llama_3.2_3B_w_mxfp4_a_mxfp4_gptq
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: false
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    queue_timeout: 60s
