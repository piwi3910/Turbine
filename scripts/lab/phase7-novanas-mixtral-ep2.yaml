# turbine-server configuration for the Phase 7 two-card gate of Mixtral-8x7B-Instruct-v0.1-FP8 (~48 GB: ~24 GB per card; KV and
#   scheduler.max_running_requests are provisional until Task 21 sizes them from the measured
#   per-rank headroom),
# expert parallel over both R9700s (expert_parallel_size 2), on novanas:
#   scripts/lab-cluster.sh [--bench-lock] mixtral-ep2-novanas   (golden, GSM8K, bench; pod loopback)
#   scripts/lab-perf.sh novanas mixtral --placement ep2 [--eval]  (vs vLLM-ROCm; listen overridden)
# Weights: /home/piwi/turbine-models/mixtral-8x7b-instruct-v0.1-fp8 on the host, mounted read-only at /models by the
# cluster and serve Jobs. The served id is the checkpoint's repo id, as `lab-serve.sh --vllm`
# serves vLLM-ROCm. Execution, scheduler and KV keys as scripts/lab/phase5-novanas-*.yaml.
server:
  listen: 127.0.0.1:18000
model:
  path: /models/mixtral-8x7b-instruct-v0.1-fp8
  served_name: RedHatAI/Mixtral-8x7B-Instruct-v0.1-FP8
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: true
parallel:
  tensor_parallel_size: 1
  expert_parallel_size: 2
  data_parallel_size: 1
  devices: [0, 1]
  collective_backend: rccl
  expert:
    placement: contiguous
kv:
  block_tokens: 128
  gpu:
    max_bytes: 4GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 32
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    # The Phase 2 scheduler.queue_timeout (CONFLICT C-1).
    queue_timeout: 60s
