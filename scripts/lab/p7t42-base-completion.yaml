# turbine-server configuration for the p7-t42 completion-form re-gate: the BF16 base
# completion baseline. The checkpoint is the base Llama-3.2-3B (no chat template, eos 128001),
# so the completion-form GSM8K candidate (mxfp4-a4) is compared against the BF16 base itself.
# Serve via: scripts/lab-serve.sh novanas scripts/lab/p7t42-base-completion.yaml
server:
  listen: 0.0.0.0:18000
model:
  path: /models/llama-3.2-3b
  served_name: base/Llama-3.2-3B
  # The base checkpoint ships no chat template; the server requires one to boot, but the
  # completion-form eval (`/v1/completions` with `prompt`) never renders it. Use the Llama-3.2
  # template committed with the mxfp4-a4 golden fixture (same special tokens).
  chat_template: tests/golden/llama-3.2-3b-instruct-mxfp4-a4/chat_template.jinja
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: false
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    queue_timeout: 60s