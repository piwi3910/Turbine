# k3s Job run by scripts/lab-test.sh novanas: the full test suite, including #[ignore] GPU
# tests, in rust:1.97-trixie with both R9700 GPUs, the host ROCm tree and the model weights
# mounted read-only. Setup: cmake + python3 from Debian, libturbine_hip.so built from
# kernels/rocm, uv (pinned) for scripts/golden/hf_reference.py. Each step prints
# `lab-step: <name>`; a failing step prints `lab-step failed: <name>` and the Job fails with
# that command's exit code.
apiVersion: batch/v1
kind: Job
metadata:
  name: turbine-lab-test
  namespace: turbine-ci
  labels:
    turbine-lab: "true"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  # A cold run fetches and compiles Composable Kernel and installs torch for the reference
  # script; later runs reuse the kernel build dir, cargo target and uv cache on the host.
  activeDeadlineSeconds: 5400
  template:
    metadata:
      labels:
        turbine-lab: "true"
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: rust:1.97-trixie
          workingDir: /home/piwi/turbine-ci/src
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              STEP=setup
              step() { STEP="$1"; echo "lab-step: $1"; }
              trap 'echo "lab-step failed: ${STEP}" >&2' ERR
              export DEBIAN_FRONTEND=noninteractive

              step "install cmake python3"
              apt-get update -qq >/dev/null
              apt-get install -y -qq cmake python3 >/dev/null
              cmake --version | head -n 1

              step "build kernels/rocm"
              # A cache configured from another source tree makes cmake refuse the build dir;
              # drop only the cache (the fetched Composable Kernel sources in _deps are kept).
              if [[ -f "$KERNEL_BUILD_DIR/CMakeCache.txt" ]] &&
                ! grep -qx "CMAKE_HOME_DIRECTORY:INTERNAL=$PWD/kernels/rocm" "$KERNEL_BUILD_DIR/CMakeCache.txt"; then
                echo "lab-step: resetting $KERNEL_BUILD_DIR cache from another source tree"
                rm -rf "$KERNEL_BUILD_DIR/CMakeCache.txt" "$KERNEL_BUILD_DIR/CMakeFiles"
              fi
              cmake -S kernels/rocm -B "$KERNEL_BUILD_DIR" \
                -DCMAKE_HIP_COMPILER="$TURBINE_ROCM_PATH/bin/hipcc" -DGPU_TARGETS=gfx1201
              cmake --build "$KERNEL_BUILD_DIR" --parallel "$(nproc)"
              test -f "$TURBINE_KERNEL_LIBRARY"
              echo "lab-step: built $TURBINE_KERNEL_LIBRARY"

              step "install uv $UV_VERSION"
              if [[ "$("$UV_INSTALL_DIR/uv" --version 2>/dev/null)" != "uv $UV_VERSION"* ]]; then
                curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
              fi
              export PATH="$UV_INSTALL_DIR:$PATH"
              uv --version

              step "cargo test"
              exec cargo test --workspace -- --include-ignored --show-output
          env:
            - name: CARGO_TARGET_DIR
              value: /home/piwi/turbine-ci/target
            - name: LD_LIBRARY_PATH
              value: /opt/rocm/rocm/lib:/opt/rocm/rocm/lib/rocm_sysdeps/lib
            - name: TURBINE_AMD_SMI_LIBRARY
              value: /opt/rocm/rocm/lib/libamd_smi.so.26.5.0
            - name: TURBINE_EXPECT_AMD
              value: "2"
            - name: TURBINE_EXPECT_AMD_ARCH
              value: gfx1201
            # Every top-level entry of /opt/rocm/rocm on novanas is an /etc/alternatives
            # symlink; inside the container the real versioned tree is the ROCm root.
            - name: TURBINE_ROCM_PATH
              value: /opt/rocm/rocm/core-7.14
            - name: KERNEL_BUILD_DIR
              value: /home/piwi/turbine-ci/target/kernels
            - name: TURBINE_KERNEL_LIBRARY
              value: /home/piwi/turbine-ci/target/kernels/libturbine_hip.so
            - name: TURBINE_TEST_BACKEND
              value: hip
            - name: TURBINE_TEST_MODEL_DIR
              value: /models/llama-3.2-3b-instruct
            - name: UV_VERSION
              value: 0.11.2
            - name: UV_INSTALL_DIR
              value: /home/piwi/turbine-ci/uv-cache/bin
            - name: UV_NO_MODIFY_PATH
              value: "1"
            - name: UV_CACHE_DIR
              value: /home/piwi/turbine-ci/uv-cache
            - name: UV_PYTHON_INSTALL_DIR
              value: /home/piwi/turbine-ci/uv-cache/python
          resources:
            limits:
              amd.com/gpu: 2
          volumeMounts:
            - name: turbine-ci
              mountPath: /home/piwi/turbine-ci
            - name: cargo-registry
              mountPath: /usr/local/cargo/registry
            - name: rocm
              mountPath: /opt/rocm/rocm
              readOnly: true
            # /opt/rocm/rocm/lib is a symlink to /etc/alternatives/rocm-lib on novanas.
            - name: rocm-lib-alternative
              mountPath: /etc/alternatives/rocm-lib
              readOnly: true
            # Weights provisioned once over SSH; tests never download.
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: turbine-ci
          hostPath:
            path: /home/piwi/turbine-ci
            type: Directory
        - name: cargo-registry
          hostPath:
            path: /home/piwi/turbine-ci/cargo-registry
            type: DirectoryOrCreate
        - name: rocm
          hostPath:
            path: /opt/rocm/rocm
            type: Directory
        - name: rocm-lib-alternative
          hostPath:
            path: /etc/alternatives/rocm-lib
            type: Directory
        - name: models
          hostPath:
            path: /home/piwi/turbine-models
            type: Directory
