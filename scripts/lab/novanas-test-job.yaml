# k3s Job template run by scripts/lab-test.sh novanas: the test suite, including #[ignore] GPU
# tests, in rust:1.97-trixie with the host ROCm tree and the model weights mounted read-only.
# The script renders the template before applying it: the RUN_ID placeholder becomes the run id
# (a unique Job name, so Jobs run side by side) and the GPUS placeholder the R9700 count (1 by
# default; 2 only for the Phase 0 inventory check, `scripts/lab-test.sh novanas --gpus 2`). It
# uploads the tree to /home/piwi/turbine-ci/runs/<run id>/src and the whole test command
# (`cargo test --no-fail-fast …`, NUL-separated argv) to runs/<run id>/test-command;
# runs/<run id>/hf-reference exists when --with-hf-reference was given (uv is installed then).
#
# Two phases, from this one template (the PHASE placeholder): the script first applies it as the
# build Job turbine-lab-build-<run id> (phase build, `amd.com/gpu: 0`: no R9700 is claimed while
# compiling), which syncs the slot, builds the kernels and runs the test command with `--no-run`,
# records its slot in runs/<run id>/slot and exits; only then does it apply the GPU Job
# turbine-lab-test-<run id> (phase test), which prefers that slot, so its sync, kernel build and
# cargo test find everything built and start the tests at once. When another run took the slot in
# between, the GPU Job simply builds in the slot it got: the build Job only warms a slot, it never
# decides what the tests run on.
#
# Caches (hostPath, all under /home/piwi/turbine-ci/cache, kept between runs):
#   cargo/{registry,git}  cargo downloads; cargo locks them itself, so all Jobs share them.
#   apt/{archives,lists}  Debian packages; apt locks them itself.
#   uv                    uv binary, Python installs and wheel cache (uv locks it itself).
#   slots/test-<n>/{src,target,kernels}  one workspace per concurrent test Job.
# Concurrency: a Job first takes the flock on slots/test-<n>.lock (n = 0 or 1, one per R9700)
# and holds it until it exits, then syncs its upload into that slot's src with rsync (only
# changed files, found by checksum; those get a fresh mtime and unchanged files keep the slot's,
# so cargo and ninja rebuild exactly what changed even when the slot's target was built from a
# newer-dated tree of another checkout — source mtimes are never carried over), builds the kernels
# in that slot's CMake build dir and runs cargo with that slot's CARGO_TARGET_DIR. Cargo's own
# target-dir lock would stop two builds from corrupting one shared target, but it serialises the
# builds and cannot protect a source tree that another run is re-syncing, so each slot has its
# own source, target and kernel build dir instead. The slot's path never changes, so the CMake
# cache is only reset when it was configured from a different source tree.
#
# Each step prints `lab-step: <name>`; a failing step prints `lab-step failed: <name>` and the
# Job fails with that command's exit code.
apiVersion: batch/v1
kind: Job
metadata:
  name: turbine-lab-test-__RUN_ID__
  namespace: turbine-ci
  labels:
    turbine-lab: "true"
    turbine-lab-role: test
    turbine-lab-run: "__RUN_ID__"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  # A cold slot fetches and compiles Composable Kernel and the whole workspace; later runs
  # rebuild only what changed.
  activeDeadlineSeconds: 5400
  template:
    metadata:
      labels:
        turbine-lab: "true"
        turbine-lab-role: test
        turbine-lab-run: "__RUN_ID__"
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: rust:1.97-trixie
          workingDir: /home/piwi/turbine-ci
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              STEP=setup
              step() { STEP="$1"; echo "lab-step: $1"; }
              trap 'echo "lab-step failed: ${STEP}" >&2' ERR
              export DEBIAN_FRONTEND=noninteractive
              RUN_DIR="$TURBINE_LAB_ROOT/runs/$TURBINE_LAB_RUN_ID"

              step "install cmake ninja python3 rsync"
              # Keep downloaded packages in the shared apt cache; refresh the lists at most every 6 h.
              rm -f /etc/apt/apt.conf.d/docker-clean
              mkdir -p /var/cache/apt/archives/partial /var/lib/apt/lists/partial
              # Concurrent Jobs share the apt cache: one apt run at a time.
              (
                flock -w 900 9
                if [[ -z "$(find /var/lib/apt/lists -maxdepth 1 -name '*_Packages*' -mmin -360 -print -quit)" ]]; then
                  apt-get update -qq >/dev/null
                fi
                apt-get install -y -qq cmake ninja-build python3 rsync >/dev/null
              ) 9>/var/cache/apt/archives/turbine-lab.flock
              cmake --version | head -n 1

              PHASE="$TURBINE_LAB_PHASE"
              [[ $PHASE == build || $PHASE == test ]]

              step "take a workspace slot"
              # The GPU Job tries the slot its build Job warmed first.
              PREFERRED=""
              if [[ $PHASE == test && -f "$RUN_DIR/slot" ]]; then PREFERRED="$(cat "$RUN_DIR/slot")"; fi
              SLOT=""
              for ((waited = 0; waited < 1800; waited += 5)); do
                for n in $PREFERRED $(seq 0 $((TURBINE_LAB_SLOTS - 1))); do
                  exec {LOCK_FD}>"$TURBINE_LAB_CACHE/slots/test-$n.lock"
                  if flock -n "$LOCK_FD"; then SLOT="test-$n"; break 2; fi
                  exec {LOCK_FD}>&-
                done
                sleep 5
              done
              [[ -n "$SLOT" ]] || { echo "no free workspace slot within 30 min" >&2; false; }
              SLOT_DIR="$TURBINE_LAB_CACHE/slots/$SLOT"
              export CARGO_TARGET_DIR="$SLOT_DIR/target"
              export KERNEL_BUILD_DIR="$SLOT_DIR/kernels"
              export TURBINE_KERNEL_LIBRARY="$KERNEL_BUILD_DIR/libturbine_hip.so"
              mkdir -p "$SLOT_DIR/src" "$CARGO_TARGET_DIR" "$KERNEL_BUILD_DIR"
              echo "lab-step: slot $SLOT (CARGO_TARGET_DIR=$CARGO_TARGET_DIR)"

              step "sync the uploaded tree into the slot"
              rsync -rlpc --delete "$RUN_DIR/src/" "$SLOT_DIR/src/"
              mapfile -d '' TEST_CMD < "$RUN_DIR/test-command"
              [[ ${#TEST_CMD[@]} -gt 2 && "${TEST_CMD[0]} ${TEST_CMD[1]}" == "cargo test" ]]
              HF_REFERENCE=0
              [[ -e "$RUN_DIR/hf-reference" ]] && HF_REFERENCE=1
              # The build Job leaves the upload for the GPU Job.
              if [[ $PHASE == test ]]; then rm -rf "$RUN_DIR"; fi
              cd "$SLOT_DIR/src"

              step "build kernels/rocm"
              # A cache configured from another source tree or generator makes cmake refuse the
              # build dir; drop only the cache (the fetched Composable Kernel sources are kept).
              if [[ -f "$KERNEL_BUILD_DIR/CMakeCache.txt" ]] && {
                ! grep -qx "CMAKE_HOME_DIRECTORY:INTERNAL=$PWD/kernels/rocm" "$KERNEL_BUILD_DIR/CMakeCache.txt" ||
                  ! grep -qx "CMAKE_GENERATOR:INTERNAL=Ninja" "$KERNEL_BUILD_DIR/CMakeCache.txt"
              }; then
                echo "lab-step: resetting $KERNEL_BUILD_DIR cache from another source tree or generator"
                rm -rf "$KERNEL_BUILD_DIR/CMakeCache.txt" "$KERNEL_BUILD_DIR/CMakeFiles"
              fi
              # Configure once; afterwards ninja re-runs cmake by itself when a CMakeLists changes.
              if [[ ! -f "$KERNEL_BUILD_DIR/CMakeCache.txt" ]]; then
                cmake -S kernels/rocm -B "$KERNEL_BUILD_DIR" -G Ninja \
                  -DCMAKE_HIP_COMPILER="$TURBINE_ROCM_PATH/bin/hipcc" -DGPU_TARGETS=gfx1201
              fi
              cmake --build "$KERNEL_BUILD_DIR" --parallel "$(nproc)"
              test -f "$TURBINE_KERNEL_LIBRARY"
              echo "lab-step: built $TURBINE_KERNEL_LIBRARY"

              if [[ $PHASE == build ]]; then
                # The test command up to its `--`, compiled but not run.
                BUILD_CMD=()
                for a in "${TEST_CMD[@]}"; do
                  [[ "$a" == -- ]] && break
                  BUILD_CMD+=("$a")
                done
                BUILD_CMD+=(--no-run)
                step "cargo test --no-run"
                echo "lab-step: ${BUILD_CMD[*]}"
                "${BUILD_CMD[@]}"
                echo "${SLOT#test-}" > "$RUN_DIR/slot"
                echo "lab-step: built in slot $SLOT"
                exit 0
              fi

              if [[ $HF_REFERENCE -eq 1 ]]; then
                step "install uv $UV_VERSION"
                if [[ "$("$UV_INSTALL_DIR/uv" --version 2>/dev/null)" != "uv $UV_VERSION"* ]]; then
                  curl -LsSf "https://astral.sh/uv/$UV_VERSION/install.sh" | sh
                fi
                export PATH="$UV_INSTALL_DIR:$PATH"
                uv --version
              fi

              step "cargo test"
              echo "lab-step: ${TEST_CMD[*]}"
              # exec keeps the slot lock (LOCK_FD is inherited) until the tests finish.
              exec "${TEST_CMD[@]}"
          env:
            - name: TURBINE_LAB_RUN_ID
              value: "__RUN_ID__"
            # build: compile only, without a GPU; test: run the tests on the GPU(s).
            - name: TURBINE_LAB_PHASE
              value: "__PHASE__"
            - name: TURBINE_LAB_ROOT
              value: /home/piwi/turbine-ci
            - name: TURBINE_LAB_CACHE
              value: /home/piwi/turbine-ci/cache
            # One workspace slot per R9700: at most two test Jobs hold a GPU at once.
            - name: TURBINE_LAB_SLOTS
              value: "2"
            - name: LD_LIBRARY_PATH
              value: /opt/rocm/rocm/lib:/opt/rocm/rocm/lib/rocm_sysdeps/lib
            - name: TURBINE_AMD_SMI_LIBRARY
              value: /opt/rocm/rocm/lib/libamd_smi.so.26.5.0
            # The devices this Job was given: the inventory test checks exactly these.
            - name: TURBINE_EXPECT_AMD
              value: "__GPUS__"
            - name: TURBINE_EXPECT_AMD_ARCH
              value: gfx1201
            # Every top-level entry of /opt/rocm/rocm on novanas is an /etc/alternatives
            # symlink; inside the container the real versioned tree is the ROCm root.
            - name: TURBINE_ROCM_PATH
              value: /opt/rocm/rocm/core-7.14
            - name: TURBINE_TEST_BACKEND
              value: hip
            - name: TURBINE_TEST_MODEL_DIR
              value: /models/llama-3.2-3b-instruct
            # OLMoE-1B-7B weights for the Phase 2 MoE tests.
            - name: TURBINE_TEST_MOE_MODEL_DIR
              value: /models/olmoe-1b-7b-0125-instruct
            - name: UV_VERSION
              value: 0.11.2
            - name: UV_INSTALL_DIR
              value: /home/piwi/turbine-ci/cache/uv/bin
            - name: UV_NO_MODIFY_PATH
              value: "1"
            - name: UV_CACHE_DIR
              value: /home/piwi/turbine-ci/cache/uv
            - name: UV_PYTHON_INSTALL_DIR
              value: /home/piwi/turbine-ci/cache/uv/python
          resources:
            limits:
              amd.com/gpu: __GPUS__
          volumeMounts:
            - name: turbine-ci
              mountPath: /home/piwi/turbine-ci
            - name: cargo-registry
              mountPath: /usr/local/cargo/registry
            - name: cargo-git
              mountPath: /usr/local/cargo/git
            - name: apt-archives
              mountPath: /var/cache/apt/archives
            - name: apt-lists
              mountPath: /var/lib/apt/lists
            - name: rocm
              mountPath: /opt/rocm/rocm
              readOnly: true
            # /opt/rocm/rocm/lib is a symlink to /etc/alternatives/rocm-lib on novanas.
            - name: rocm-lib-alternative
              mountPath: /etc/alternatives/rocm-lib
              readOnly: true
            # Weights provisioned once over SSH; tests never download.
            - name: models
              mountPath: /models
              readOnly: true
            # The Phase 4 NVMe KV tier (kv.nvme.path of scripts/lab/phase4-novanas.yaml).
            - name: turbine-kv
              mountPath: /home/piwi/turbine-kv
      volumes:
        - name: turbine-ci
          hostPath:
            path: /home/piwi/turbine-ci
            type: Directory
        - name: cargo-registry
          hostPath:
            path: /home/piwi/turbine-ci/cache/cargo/registry
            type: DirectoryOrCreate
        - name: cargo-git
          hostPath:
            path: /home/piwi/turbine-ci/cache/cargo/git
            type: DirectoryOrCreate
        - name: apt-archives
          hostPath:
            path: /home/piwi/turbine-ci/cache/apt/archives
            type: DirectoryOrCreate
        - name: apt-lists
          hostPath:
            path: /home/piwi/turbine-ci/cache/apt/lists
            type: DirectoryOrCreate
        - name: rocm
          hostPath:
            path: /opt/rocm/rocm
            type: Directory
        - name: rocm-lib-alternative
          hostPath:
            path: /etc/alternatives/rocm-lib
            type: Directory
        - name: models
          hostPath:
            path: /home/piwi/turbine-models
            type: Directory
        - name: turbine-kv
          hostPath:
            path: /home/piwi/turbine-kv
            type: DirectoryOrCreate
