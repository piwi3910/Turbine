# turbine-server configuration for the Phase 7 one-card gate of gpt-oss-20b (MXFP4 experts, ~14 GB) on quadronix:
#   scripts/lab-bench.sh --model gpt-oss-20b [--golden16]
#   scripts/lab-perf.sh quadronix gpt-oss-20b
#   scripts/lab-serve.sh quadronix scripts/lab/phase7-quadronix-gpt-oss-20b.yaml [--set <k>=<v>]...
# Weights: /home/piwi/turbine-models/gpt-oss-20b on the host, mounted read-only at /models by
# scripts/lab/quadronix-serve-job.yaml (lab-bench.sh serves natively and overrides model.path).
# The served id is the checkpoint's repo id, as `lab-serve.sh --vllm gpt-oss-20b` serves vLLM-ROCm.
# Execution, scheduler and KV keys as scripts/lab/phase2c-quadronix-llama.yaml.
server:
  listen: 0.0.0.0:18000
model:
  path: /models/gpt-oss-20b
  served_name: openai/gpt-oss-20b
  # The checkpoint's Harmony template pins the system message's date with
  # `strftime_now("%Y-%m-%d")` (the host UTC clock), which makes the golden c1 fixture
  # (p10-p16, chat-kind) date-dependent. This copy fixes the date to 2026-10-16 (the reference's
  # capture date) and is byte-identical otherwise; `scripts/golden/hf_reference.py --chat-template`
  # renders the reference with the same file. Relative to the tree root (the server's cwd in
  # lab-bench.sh and the lab-serve Job).
  chat_template: tests/golden/gpt-oss-20b/chat_template.jinja
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: true
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    # The Phase 2 scheduler.queue_timeout (CONFLICT C-1).
    queue_timeout: 60s
