# turbine-server configuration for the Phase 5 tensor-parallel lab run on novanas:
#   scripts/lab-cluster.sh tp2-novanas
# Both R9700s of the Job form one TP group (tensor_parallel_size 2, local rank mode by default;
# the scenario repeats Llama in static mode with --set parallel.ranks.*). The server listens on
# the pod's loopback only. Weights: /home/piwi/turbine-models/llama-3.2-3b-instruct on the host,
# mounted read-only at /models by scripts/lab/novanas-cluster-job.yaml. Execution, scheduler and
# KV keys as scripts/lab/phase2c-novanas-llama.yaml, so the TP run is comparable with the
# single-GPU lab-bench baseline.
server:
  listen: 127.0.0.1:18000
model:
  path: /models/llama-3.2-3b-instruct
  served_name: meta-llama/Llama-3.2-3B-Instruct
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: false
parallel:
  tensor_parallel_size: 2
  data_parallel_size: 1
  devices: [0, 1]
  collective_backend: rccl
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    # The Phase 2 scheduler.queue_timeout (CONFLICT C-1).
    queue_timeout: 60s
