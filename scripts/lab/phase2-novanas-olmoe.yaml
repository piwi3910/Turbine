# turbine-server configuration for the Phase 2 lab runs on novanas:
#   scripts/lab-serve.sh novanas scripts/lab/phase2-novanas-olmoe.yaml
# Weights: /home/piwi/turbine-models/olmoe-1b-7b-0125-instruct on the host, mounted read-only at
# /models by scripts/lab/novanas-serve-job.yaml. The scheduler and KV keys spell out the Phase 2
# defaults so the golden and baseline runs record what they ran with.
server:
  listen: 0.0.0.0:18000
model:
  path: /models/olmoe-1b-7b-0125-instruct
  served_name: allenai/OLMoE-1B-7B-0125-Instruct
execution:
  backend: hip
kv:
  block_tokens: 16
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 8192
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
  queue_timeout: 60s
