# turbine-server configuration for the Phase 6a `awq_int4` proof on novanas (plan Task 18):
#   scripts/lab-bench.sh --model llama-awq [--golden16] [--quick]
#   scripts/lab-serve.sh novanas scripts/lab/phase6-novanas-llama-awq.yaml [--set <k>=<v>]...
# Weights: casperhansen/llama-3.2-3b-instruct-awq @ 272b3bde867b606760447deb9a4d2719fbdfd3ae in
# /home/piwi/turbine-models/llama-3.2-3b-instruct-awq (lab-bench.sh passes model.path; the serve
# Job mounts it at /models). INT4 group-128 weights, BF16 activations (W4A16): qgemm runs
# turbine_hip_int4_wmma up to 128 rows and turbine_hip_int4_dequant above (card profile
# gfx1201). Everything else is the Phase 2c Llama configuration, so the BENCH lines compare
# with the BF16 baseline (scripts/lab/phase2c-novanas-llama.yaml).
server:
  listen: 0.0.0.0:18000
model:
  path: /models/llama-3.2-3b-instruct-awq
  served_name: casperhansen/llama-3.2-3b-instruct-awq
execution:
  backend: hip
  gemm_autotune: true
  decode_graphs: true
  device_sampling: true
  fused_ops: true
  sampler_threads: 4
  overlap_scheduling: false
kv:
  block_tokens: 128
  gpu:
    max_bytes: 8GiB
scheduler:
  continuous_batching: true
  chunked_prefill: true
  max_running_requests: 64
  max_batch_tokens: 2048
  prefill_chunk_tokens: 2048
  max_queued_requests: 256
reliability:
  admission:
    # The Phase 2 scheduler.queue_timeout (CONFLICT C-1).
    queue_timeout: 60s
