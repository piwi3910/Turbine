[package]
name = "turbine-api"
description = "Turbine HTTP API: OpenAI-compatible routes and /turbine/v1 diagnostics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
# SSE body stream over the engine's event receiver (`stream::unfold`).
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# `GenerationStream` is a bounded `tokio::sync::mpsc::Receiver`.
tokio.workspace = true
tracing.workspace = true
turbine-core.workspace = true
turbine-observability.workspace = true
# Response ids `cmpl-<uuid>` / `chatcmpl-<uuid>` render the `RequestId` uuid.
uuid.workspace = true

[dev-dependencies]
tower.workspace = true

[lints.rust]
unsafe_code = "forbid"
