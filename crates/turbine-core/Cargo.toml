[package]
name = "turbine-core"
description = "Turbine configuration model and shared vocabulary types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# P3 S-16: enables the reliability.fault_injection section.
fault-injection = []

[dependencies]
serde.workspace = true
serde_norway.workspace = true
thiserror.workspace = true
# Phase 2m: the `module_selected` log line of every registry selection
tracing.workspace = true
tracing-subscriber.workspace = true
# Phase 1: RequestId (uuid) and the EOS id list of StopConditions (smallvec)
uuid.workspace = true
smallvec.workspace = true
# Phase 2: the JSON schema carried by ConstraintSpec::JsonSchema
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints.rust]
unsafe_code = "forbid"
