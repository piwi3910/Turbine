[package]
name = "turbine-distributed"
description = "Turbine collectives (host reference and runtime-loaded NCCL-API backends), rank runtime, tensor-parallel sharding rules and data-parallel routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
turbine-core.workspace = true
turbine-observability.workspace = true
turbine-tensor.workspace = true
# turbine_collective_* metric families
prometheus-client.workspace = true
# BF16 element interpretation in the host reference backend
half.workspace = true
# Runtime loading of librccl.so.1 / libnccl.so.2; nothing links a collective library at build time
libloading.workspace = true

[build-dependencies]
# Finds the host C compiler that build.rs uses to compile the NCCL-API stub for the ffi tests
cc.workspace = true

# `unsafe` is denied crate-wide; only the NCCL-API binding module `collective::ffi` carries
# `#[allow(unsafe_code)]` (contract §1.3, checked by turbine-kernels tests/unsafe_isolation.rs).
[lints.rust]
unsafe_code = "deny"
