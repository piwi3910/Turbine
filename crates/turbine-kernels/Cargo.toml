[package]
name = "turbine-kernels"
description = "Turbine kernel capability traits, registry, CPU reference provider and runtime-loaded shim bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
turbine-core.workspace = true
turbine-device.workspace = true
turbine-observability.workspace = true
turbine-tensor.workspace = true
# Kernel selection log and the turbine_kernel_provider_selected gauge
prometheus-client.workspace = true
tracing.workspace = true
# Runtime loading of the kernel shim library; nothing links a GPU library at build time
libloading.workspace = true
# bf16/f16 <-> f32 conversion in the cpu-reference provider (the host-side numerical oracle)
half.workspace = true

[build-dependencies]
# Finds the host C compiler that build.rs uses to compile the stub shim libraries for the tests
cc.workspace = true

[dev-dependencies]
# The TurboQuant codec (records, rotation signs, codebooks) the reference
# `cpu::tq_attention` is tested against; dev only, turbine-kv does not depend on this crate
turbine-kv.workspace = true
# Captures the JSON kernel selection log in registry tests
tracing-subscriber.workspace = true
# The seeded uniform draws of the logits_reduce reference test (the sampler's ChaCha8 stream)
rand_chacha.workspace = true
# Parses the core crates' sources in tests/vendor_neutral_api.rs (vendor_types_in_core_signatures)
syn.workspace = true
# Reads the recorded kernel choices (tests/lab/kernel-choices-*.json) in the hip_ops lab tests
serde_json.workspace = true

# FFI to the kernel shim libraries; every `unsafe` block carries a `// SAFETY:` comment
# (contract §1.3, checked by tests/unsafe_isolation.rs).
[lints.rust]
unsafe_code = "allow"
