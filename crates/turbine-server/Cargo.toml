[package]
name = "turbine-server"
description = "The turbine-server binary: CLI, startup order, wiring and exit codes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
turbine-api.workspace = true
turbine-core.workspace = true
turbine-device.workspace = true
turbine-observability.workspace = true
# Device memory backends: HostMemory for the cpu reference backend
turbine-tensor.workspace = true
# Kernel shim loading, the cpu-reference provider and the kernel registry
turbine-kernels.workspace = true
# Model config, tokenizer, chat template, budget, weight loader, executor and generation loop
turbine-model.workspace = true
# turbine_requests_total, turbine_request_{ttft,itl,e2e}_seconds, turbine_tokens_total
prometheus-client.workspace = true
# EOS id lists (turbine_core::request::StopConditions), sequence lists of a request
smallvec.workspace = true
# L0 KV block pool, its metrics and the /turbine/v1/kv document (Phase 2 engine)
turbine-kv.workspace = true
# Test-only cap on accepted connections' send buffers (startup::SEND_BUFFER_ENV)
socket2.workspace = true
# Continuous-batching scheduler, its metrics and the /turbine/v1/scheduler document
turbine-scheduler.workspace = true
# P3: memory budget, reservation ledger, emergency reserve, pressure controller, admission,
# recovery and circuit breaker
turbine-reliability.workspace = true
# P3: the per-iteration engine statistics the pressure controller reads without a lock
arc-swap.workspace = true

[features]
# P3 S-16: `reliability.fault_injection` (failed pool reservations, injected device errors,
# telemetry overrides). Never in a default build.
fault-injection = ["turbine-core/fault-injection", "turbine-reliability/fault-injection"]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# Validating structured outputs and tool-call arguments in the tiny_server tests
jsonschema.workspace = true
# Held-stream clients with a small receive buffer, so an unread stream back-pressures at once
socket2.workspace = true
