# Development configuration: the TS §15 example plus the Phase 0 logging/devices sections, the
# Phase 1 execution section, the Phase 2 timeout, scheduler, KV and structured-output keys and the
# Phase 2c execution switches (spelled out at their defaults). From Phase 1 turbine-server loads
# model.path at startup (exit 1 unless it is a directory holding config.json); point it at real
# weights with --set model.path=<dir>. --check-config validates this file without reading the
# model.
server:
  listen: 127.0.0.1:8000
  max_request_bytes: 8MiB
  # Durations are <integer><ms|s|m|h>. Total request deadline (504 request_timeout).
  request_timeout: 600s
  # How long a request may stay paused on a full output channel before it is cancelled.
  slow_client_timeout: 30s
  # Drain time for running requests after SIGINT/SIGTERM.
  shutdown_grace: 30s
model:
  path: /models/llama-3.2-3b-instruct
  dtype: bf16
  # null: <org>/<name> for a Hugging Face snapshot path, else the last path component.
  served_name: null
  # null: min(32768, max_position_embeddings).
  max_seq_len: null
  # A registered tool-call format (llama3_json) or none; null: llama3_json for LlamaForCausalLM
  # whose chat template renders tools, else none.
  tool_call_parser: null
kv:
  # Tokens per KV page. On HIP, a multiple of 128 runs paged attention on Composable Kernel
  # fmha_fwd_pagedkv; any other size falls back to the slower Turbine kernel.
  block_tokens: 128
  gpu:
    enabled: true
    # L0 (GPU) block-pool cap; null (Phase 3 default) = the kv pool of the memory budget:
    # what remains after weights, workspace, runtime overhead and the emergency reserve.
    # false is rejected from Phase 4 (L0 is required).
    max_bytes: null
  # L1 pinned host tier; ignored with a WARN on unified-memory devices (GB10).
  cpu:
    enabled: true
    # At most host MemTotal minus reliability.memory.host_reserve_bytes.
    max_bytes: 64GiB
  # L2 NVMe slab files; wiped at startup, nothing persists across restarts.
  nvme:
    enabled: false
    # Absolute; created if absent, must be writable.
    path: /var/lib/turbine/kv
    # At most the free space at startup minus 10 %.
    max_bytes: 64GiB
    # A non-zero multiple of 4KiB holding at least one 4KiB-rounded block slot.
    slab_bytes: 1GiB
    max_queue_depth: 64
    io_threads: 4
  # cost_aware or lru (the benchmark baseline).
  policy: cost_aware
  # Blocks scoring below this are dropped instead of demoted.
  demote_min_value: 0.0
  # false: no prefix lookup and no reuse (A/B switch).
  prefix_sharing: true
  transfer:
    # At least one KV block.
    max_inflight_bytes: 1GiB
  session:
    max_sessions: 10000
    # Idle sessions demote L0 -> L1 after hot_ttl and L1 -> L2 after warm_ttl (> hot_ttl).
    hot_ttl: 60s
    warm_ttl: 10m
    # Session metadata is dropped after this much idle time.
    max_idle: 1h
  prefetch:
    lead_time: 2s
    max_queue: 256
  policy_weights:
    # Reuse boost of a hot session's blocks, 0..1.
    session_active: 0.5
    hit_half_life: 60s
reliability:
  enabled: true
  emergency_vram_reserve: 2GiB
  adaptive_admission: true
scheduler:
  # false forces one running request.
  continuous_batching: true
  # false rejects prompts longer than max_batch_tokens at submission.
  chunked_prefill: true
  max_running_requests: 64
  # Per-iteration token budget (decodes + prefill chunks).
  max_batch_tokens: 8192
  prefill_chunk_tokens: 2048
  # HTTP-to-engine submission-channel capacity (the waiting queue is reliability.admission, Phase 3).
  max_queued_requests: 256
  # Scheduling policy (admission order, preemption victim, chunk sizing): a registered policy
  # name (default).
  policy: default
structured_output:
  # Largest accepted response_format JSON schema or tool-definition JSON (1KiB..1MiB).
  max_schema_bytes: 64KiB
  # Longest grammar compilation before 400 invalid_json_schema.
  compile_timeout: 5s
distributed:
  enabled: false
logging:
  format: text
  level: info
devices:
  nvml_library: null
  amd_smi_library: null
execution:
  # Kernel backend, a registered backend name: hip (AMD, Phase 1) or cpu (the reference
  # provider; tests and tiny models only). An unregistered name (cuda until phase-2b-nvidia) is
  # rejected (exit 2) before any port is bound.
  backend: hip
  # Global index from the device inventory (GET /turbine/v1/status); its vendor must match backend.
  device: 0
  # Card profile (per-card thresholds and kernel preferences): auto picks the profile of the
  # device's architecture; otherwise a registered profile name (gfx1201).
  card_profile: auto
  # null: TURBINE_KERNEL_LIBRARY, then libturbine_hip.so beside the executable, then the loader
  # path.
  kernel_library: null
  # Phase 2c switches: each defaults to the optimised path; false restores the Phase 2 one.
  # Run each GEMM shape on the algorithm the kernel library's tuned table pins for the card
  # (kernels/rocm/tuning/<arch>/gemm.tsv, measured offline; restart-stable). false: hipBLASLt's
  # first heuristic answer for every shape. Ignored by the cpu backend.
  gemm_autotune: true
  # Capture decode-only iterations into a graph per batch size and replay them. Ignored when the
  # kernel library lacks the graph functions.
  decode_graphs: true
  # Reduce logits rows on the device (top-n, log-sum-exp, categorical draw) when the request
  # allows it, instead of copying the full vocabulary row to the host.
  device_sampling: true
  # Fused QKV and gate/up projections and the fused residual add + RMSNorm.
  fused_ops: true
  # Threads sampling rows in parallel (1..=64; 1 is serial); the engine uses at most the host's
  # available parallelism minus one.
  sampler_threads: 4
  # Launch each engine iteration before the host work (sampling, detokenisation, events) of the
  # previous one, its decodes taking their tokens on the device. Ignored when the kernel library
  # lacks host staging (ABI v2.3) or device_sampling is off. Off by default: on novanas it
  # measured no faster and raised OLMoE's median time to first token.
  overlap_scheduling: false
parallel:
  # Phase 5 multi-GPU plan, validated before the port is bound (exit 2). Integer or auto:
  # tensor parallelism 1..8 (a power of two dividing the attention heads), data parallelism 1..64.
  tensor_parallel_size: 1
  data_parallel_size: 1
  # auto, or a list of global device indices (one vendor; tensor × data entries).
  devices: auto
  # auto (rccl on AMD, nccl on NVIDIA, host for tensor_parallel_size 1), rccl, nccl or host.
  collective_backend: auto
  # null: libnccl.so.2 on the loader path / /opt/rocm/lib/librccl.so.1 then the loader path.
  nccl_library: null
  rccl_library: null
  # Lets data-parallel replicas share one device (testing only).
  allow_device_sharing: false
  # Leader-to-worker step-plan queue bound (1..16).
  plan_queue_depth: 2
  # prefix_affinity or least_loaded.
  router: prefix_affinity
  collective:
    # Communicator init bound (1s..30m) and per-step collective bound (100ms..10m).
    init_timeout: 120s
    op_timeout: 30s
  ranks:
    # local: one thread per device in this process; static: one process per rank, joined to
    # the leader over the rank transport (tensor_parallel_size > 1, data_parallel_size 1).
    mode: local
    rank: 0
    leader: null
    local_devices: [0]
    # The registered rank transport carrying the static bootstrap and step plans
    # (docs/extending/rank-transport.md): tcp.
    transport: tcp
