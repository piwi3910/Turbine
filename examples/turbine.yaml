# Development configuration: the TS §15 example plus the Phase 0 logging/devices sections and
# the Phase 1 execution section. From Phase 1 turbine-server loads model.path at startup (exit 1
# unless it is a directory holding config.json); point it at real weights with
# --set model.path=<dir>. --check-config validates this file without reading the model.
server:
  listen: 127.0.0.1:8000
  max_request_bytes: 8MiB
model:
  path: /models/llama-3.2-3b-instruct
  dtype: bf16
kv:
  block_tokens: 16
  gpu: { enabled: true }
  cpu:
    enabled: true
    max_bytes: 64GiB
  nvme:
    enabled: false
    path: /var/lib/turbine/kv
reliability:
  enabled: true
  emergency_vram_reserve: 2GiB
  adaptive_admission: true
scheduler:
  continuous_batching: true
  chunked_prefill: true
distributed:
  enabled: false
logging:
  format: text
  level: info
devices:
  nvml_library: null
  amd_smi_library: null
execution:
  # Kernel backend: hip (AMD, Phase 1) or cpu (the reference provider; tests and tiny models
  # only). cuda is rejected (exit 2) until phase-2b-nvidia.
  backend: hip
  # Global index from the device inventory (GET /turbine/v1/status); its vendor must match backend.
  device: 0
  # null: TURBINE_KERNEL_LIBRARY, then libturbine_hip.so beside the executable, then the loader
  # path.
  kernel_library: null
