[workspace]
resolver = "3"
members = ["crates/*", "benches/turbine-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
turbine-core = { path = "crates/turbine-core" }
turbine-observability = { path = "crates/turbine-observability" }
turbine-device = { path = "crates/turbine-device" }
turbine-api = { path = "crates/turbine-api" }
turbine-tensor = { path = "crates/turbine-tensor" }
turbine-kernels = { path = "crates/turbine-kernels" }
turbine-model = { path = "crates/turbine-model" }
turbine-kv = { path = "crates/turbine-kv" }
turbine-scheduler = { path = "crates/turbine-scheduler" }
turbine-reliability = { path = "crates/turbine-reliability" }
# P3: lock-free snapshot the engine reads once per iteration (decision: arc-swap 1.x).
arc-swap = "1.9"
axum = "0.8.9"
# P4 KV identity: block and namespace keys, model fingerprint
blake3 = "1.8"
cc = "1.5.1"
clap = { version = "4.6.7", features = ["derive"] }
# P4 L2 NVMe tier: per-block checksum
crc32c = "0.6"
futures-util = "0.3.34"
half = "2.7.1"
# Phase 2 dev-dependency: validating structured outputs against their JSON schema in tests
jsonschema = { version = "0.58.0", default-features = false }
libloading = "0.9.0"
# Phase 2 structured output (S-17/S-18): constrained decoding; MIT license. Exact pin, bumped
# together with toktrie_hf_tokenizers (same release train, same tokenizers 0.21 line).
llguidance = "=1.8.0"
minijinja = { version = "2.24.0", features = ["json", "loader", "loop_controls", "preserve_order"] }
minijinja-contrib = { version = "2.24.0", features = ["pycompat"] }
nvml-wrapper = "0.13.0"
prometheus-client = "0.25.1"
# Phase 2 dev-dependency: property tests of KV accounting and scheduler invariants
proptest = "1.11.0"
rand_chacha = "0.9.0"
rand_core = { version = "0.9.5", features = ["os_rng"] }
reqwest = { version = "0.13.5", default-features = false }
safetensors = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
smallvec = "1.16.2"
# Socket buffer sizes: the server's test-only send-buffer cap and the held-stream test clients
socket2 = "0.6.5"
# Parses the core crates' sources in turbine-kernels tests/vendor_neutral_api.rs (dev only)
syn = { version = "3.0.6", features = ["full", "visit"] }
thiserror = "2.0.21"
# Phase 2: builds the llguidance token trie from tokenizer.json; MIT license
toktrie_hf_tokenizers = "=1.8.0"
tokenizers = { version = "=0.21.4", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# P4 L2 tier tests: temporary slab directories
tempfile = "3.27"
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

# The CPU reference provider is the numerical oracle for GPU op tests on real shapes; optimise it
# even in dev/test builds so those comparisons finish in seconds.
[profile.dev.package.turbine-kernels]
opt-level = 3

# The KV hierarchy and the kv-sim replay run long deterministic simulations in tests (about
# 17 s optimised versus minutes at opt-level 0, measured during P4 planning).
[profile.dev.package.turbine-kv]
opt-level = 3

[profile.dev.package.turbine-bench]
opt-level = 3
