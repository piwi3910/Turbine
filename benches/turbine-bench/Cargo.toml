[package]
name = "turbine-bench"
description = "Load generator for OpenAI-compatible endpoints (TTFT, ITL, E2E, throughput)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "turbine-bench"
path = "src/main.rs"

[[bin]]
name = "turbine-golden"
path = "src/bin/turbine-golden.rs"

[dependencies]
clap.workspace = true
futures-util.workspace = true
# rand_chacha: seeded ChaCha8 PRNG for the open-loop Poisson arrivals and per-request length draws.
rand_chacha.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# HumanDuration: --duration uses the configuration duration grammar (CONFLICT C-14);
# kv-sim (P4): the real KV hierarchy on virtual time; deterministic request ids;
# `turbine-golden eval-compare --max-drop` defaults to `quality.max_accuracy_drop` (umbrella S-4)
turbine-core.workspace = true
turbine-kv.workspace = true
turbine-tensor.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
# lab_scripts: the lab configs and k3s manifests are checked against the real config model
# (`turbine-core`, a normal dependency).
serde_norway.workspace = true

[lints.rust]
unsafe_code = "forbid"
