# cargo-nextest settings for scripts/gate.sh (nextest runs every test as its own process, all at
# once, so wall-clock assertions see more contention than under `cargo test`).

# server_cli asserts shutdown timings against real clocks (e.g. sigterm_drains_then_cancels:
# a short stream must finish inside the 2 s grace); run each of its tests with the host to itself.
[[profile.default.overrides]]
filter = 'binary(server_cli)'
threads-required = 'num-test-threads'

# hostmem_lab drives both GPUs: a test that hangs must end, not hold the lab Job (the tests also
# carry their own watchdog, for runs under plain `cargo test`).
[[profile.default.overrides]]
filter = 'binary(hostmem_lab)'
slow-timeout = { period = "60s", terminate-after = 15 }

# tiny_server tests whose assertions are wall-clock bounds the specs fix (P2 S-8: a dropped
# client's KV freed within 1 s; P2c S-1: the eight stage timings sum to the iteration's duration
# within 5 % or 0.5 ms). Under a fully loaded host the OS can preempt the engine thread between
# two clock reads for longer than that; run them with the host to themselves rather than loosen
# the bounds (both flaked in parallel gates on novanas, 2026-09-28). Likewise the admission and
# slow-client tests, whose streams and queues are judged against 1-10 s waits (queue_full_429 and
# slow_client_paused_then_cancelled flaked in parallel gates, 2026-09-28; they pass alone).
[[profile.default.overrides]]
filter = 'binary(tiny_server) & (test(=disconnect_releases_kv) | test(=iteration_stage_breakdown) | test(=queue_full_429) | test(=slow_client_paused_then_cancelled))'
threads-required = 'num-test-threads'
